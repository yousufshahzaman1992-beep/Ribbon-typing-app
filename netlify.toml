[build]
  command = "npm run build"
  publish = "dist"

# NOTE ON ROUTING
# ---------------
# Known routes are matched explicitly below. Because these redirects are not
# "force" rules, real static files always win, which serves:
#   /             -> /index.html        (static, fully rendered landing page)
#   /privacy.html -> /privacy.html      (static)
#   /404.html     -> /404.html          (static, custom not-found page)
# Everything that is not a known route falls through to the final rule and gets
# an actual HTTP 404 instead of silently returning the homepage with a 200.

# ── API routes: rewrite /api/* to serverless functions (preserve HTTP method) ──
[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200
  force = true

[[redirects]]
  from = "/api/reminders"
  to = "/.netlify/functions/reminders"
  status = 200
  force = true

[[redirects]]
  from = "/api/og-card"
  to = "/.netlify/functions/og-card"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-drill"
  to = "/.netlify/functions/generate-drill"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-smart-drill"
  to = "/.netlify/functions/generate-smart-drill"
  status = 200
  force = true

[[redirects]]
  from = "/api/weekly-challenge"
  to = "/.netlify/functions/weekly-challenge"
  status = 200
  force = true

[[redirects]]
  from = "/api/llm-status"
  to = "/.netlify/functions/llm-status"
  status = 200
  force = true

# ── Challenge share URLs get server-rendered social meta tags ─────────────────
[[redirects]]
  from = "/*"
  query = { challenge = ":challenge" }
  to = "/.netlify/functions/challenge-meta"
  status = 200
  force = true

# ── React typing coach: only /app is client-rendered. Serve it through the
#    app-shell function so it gets the same unique title, description,
#    canonical "/app" and noindex the Express server produces for /app. ───────
[[redirects]]
  from = "/app"
  to = "/.netlify/functions/app-shell"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/.netlify/functions/app-shell"
  status = 200

# ── Static SEO guide pages: serve each at its extensionless canonical URL
#    (matching sitemap.xml and the page's own <link rel="canonical">) instead
#    of letting Pretty URLs 301 to a trailing-slash variant. ──────────────────
[[redirects]]
  from = "/ad-free-typing-test"
  to = "/ad-free-typing-test/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/typing-practice-for-beginners"
  to = "/typing-practice-for-beginners/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/offline-typing-test"
  to = "/offline-typing-test/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/typing-games"
  to = "/typing-games/index.html"
  status = 200
  force = true

# ── Programmatic content landing pages (generated by scripts/generate-seo-pages.ts).
#    Each is a real prerendered HTML file; serve it at its extensionless URL so
#    it returns 200 with the same canonical URL listed in sitemap.xml. ─────────
[[redirects]]
  from = "/ssc-chsl-hindi-typing-test"
  to = "/ssc-chsl-hindi-typing-test/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/clerical-civil-exam-practice"
  to = "/clerical-civil-exam-practice/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/hindi-typing-lessons"
  to = "/hindi-typing-lessons/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/javascript-syntax-practice"
  to = "/javascript-syntax-practice/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/python-speed-test"
  to = "/python-speed-test/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/html-css-tag-drills"
  to = "/html-css-tag-drills/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/alice-in-wonderland"
  to = "/alice-in-wonderland/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sherlock-holmes-paragraphs"
  to = "/sherlock-holmes-paragraphs/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/moby-dick-excerpts"
  to = "/moby-dick-excerpts/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/medical-terminology-drills"
