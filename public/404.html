<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Ribbon Typing Coach</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The page you requested could not be found. Head back to Ribbon Typing Coach and take a free typing speed test." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0B0C10" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B0C10;
        color: #C5C6C7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.7;
        padding: 24px;
      }
      main { max-width: 560px; text-align: center; }
      .code {
        font-size: 72px;
        font-weight: 900;
        letter-spacing: -0.04em;
        margin: 0;
        background: linear-gradient(90deg, #FDE68A, #F59E0B, #B45309);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { color: #E8EAED; font-size: 24px; margin: 8px 0 12px; }
      p { font-size: 15px; color: #A1A1AA; margin: 0 0 24px; }
      a { color: #F59E0B; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .btn {
        display: inline-block;
        background: #F59E0B;
        color: #1A1206;
        font-weight: 800;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 14px;
      }
      .btn:hover { text-decoration: none; opacity: 0.92; }
      .links { margin-top: 28px; font-size: 13px; color: #6B7280; }
      .links a { margin: 0 10px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you were looking for doesn't exist or has moved. Let's get you back to typing.</p>
      <a class="btn" href="/">Go to the typing test</a>
      <div class="links">
        <a href="/">Home</a>
        <a href="/app">Typing Coach</a>
        <a href="/privacy.html">Privacy</a>
      </div>
    </main>
  </body>
</html>
